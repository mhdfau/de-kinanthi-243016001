services:
  postgres:
    image: postgres:16
    container_name: pg_kinanthi
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinanthi
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password_aman123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
